<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>Desafio das Imagens</h1>
    <p>Inserir imagens em <strong>HTML</strong> é muito simples, tanto no conteúdo quanto lá em cima, como icone favorito!</p>

        <picture>
            <source media="(max-width: 350px)" srcset="icone.png" type="image/png">
            <source media="(max-width: 500px)" srcset="github-p.png" type="image/png">
            <source media="(max-width: 750px)" srcset="github-m.png" type="image/png">
            <source media="(max-width: 1050px)" srcset="github-g.png" type="image/png">
            <img src="github-gg.png" alt="github">
        </picture>
</body>
</html>
