<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML5</title>
    <style>
        h1 {
            text-shadow: 1px 1px 1px black;
        }
        ul {
            text-decoration: underline;
            text-decoration-style: dotted;
            list-style-type: square;
        }
    </style>
</head>
<body>
    <h1>Tags em HTML5</h1>
    <ul>
        <li title="tag <p>">Páragrafos</li>
        <li  title="tag <h1>">Títulos</li>
        <li title="tag <a>">Imagem</li>
        <li title="tag <abbr>">Abreviações</li>
        <li title="tag <code>">Códigos-fonte</li>
        <li title="tag <ol>">Listas numeradas</li>
        <li title="tag <ul>">Lista com Demarcadores</li>
    </ul>
</body>
</html>
